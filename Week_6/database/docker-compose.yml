services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: fitness_booking

    ports:
      - "5432:5432"

    volumes:
      - week6_postgres_data:/var/lib/postgresql

volumes:
  week6_postgres_data: